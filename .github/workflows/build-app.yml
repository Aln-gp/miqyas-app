name: Najd AI Dynamic Platform Builder

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Dynamic Multi-Platform Compiler
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java Environment
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter Framework
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Initialize Project & Install Packages
      run: |
        # إنشاء المشروع بالإعدادات الافتراضية المستقرة لمنع أخطاء التوافق
        flutter create . --overwrite --org com.Alnofaie
        
        # حقن صلاحيات الأندرويد الأساسية للتطبيقات المستهدفة داخل ملف المانيفست
        if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
          sed -i '' 's|<manifest .*|&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>|' android/app/src/main/AndroidManifest.xml
        fi
        
        # تجهيز مجلدات الخدمات والفايربيس وإدخال الـ Secrets إذا تواجدت
        mkdir -p android/app ios/Runner
        if [ ! -z "${{ secrets.FIREBASE_JSON_CONTENT }}" ]; then
          echo '${{ secrets.FIREBASE_JSON_CONTENT }}' > android/app/google-services.json
        fi
        if [ ! -z "${{ secrets.FIREBASE_IOS_PLIST }}" ]; then
          echo '${{ secrets.FIREBASE_IOS_PLIST }}' > ios/Runner/GoogleService-Info.plist
        fi
        
        # ربط مكاتب الفايربيس بالطريقة الحديثة المتوافقة 100% مع ملفات الـ kts والجراديل الكلاسيكية
        if [ -f "android/build.gradle.kts" ]; then
          # إدراج مكاتب جوجل لملف الإعدادات الرئيسي kts
          sed -i '' 's|plugins {|plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false|' android/build.gradle.kts
          # تفعيل الملحق داخل ملف تطبيق الأندرويد kts
          sed -i '' 's|plugins {|plugins {\n    id("com.google.gms.google-services")|' android/app/build.gradle.kts
        elif [ -f "android/build.gradle" ]; then
          sed -i '' 's|dependencies {|dependencies {\n        classpath "com.google.gms:google-services:4.3.15"|' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
        fi

        # إضافة حزم فلوتر الأساسية للمنصة ولتطبيقات المستخدمين مع تعطيل فحص الـ WebAssembly المؤقت
        flutter pub add http flutter_tts image_picker file_picker firebase_core firebase_auth shared_preferences url_launcher
        flutter pub get
        
        # تعديل الـ minSdkVersion ليتوافق مع مكاتب الفايربيس الحديثة
        if [ -f "android/app/build.gradle.kts" ]; then
          sed -i '' 's/minSdkVersion = .*/minSdkVersion = 23/g' android/app/build.gradle.kts || true
        elif [ -f "android/app/build.gradle" ]; then
          sed -i '' 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
        fi

    - name: Execute Conditional Building
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        GH_TOKEN_ENV: ${{ secrets.GH_TOKEN }}
        WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      run: |
        # ملاحظة للمحرك البرمجي لـ نجد AI: قم بالتحكم بالأسطر أدناه تفعيلاً أو تعطيلاً بناءً على رغبة المستخدم:
        
        # --- [منصة الويب] --- مع إضافة خيار تخطي فحص wasm عشان حزمة flutter_tts ما تعطل بناء الموقع
        flutter build web --release --no-wasm-dry-run --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV" --dart-define=FIREBASE_WEB_API_KEY="$WEB_API_KEY" --dart-define=FIREBASE_WEB_APP_ID="$WEB_APP_ID"
          
        # --- [منصة الأندرويد] ---
        flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"
        
        # --- [منصة الآيفون] ---
        flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"

    - name: Bundle iOS App into IPA Archive
      run: |
        # تجميع ملف الآيفون وتجهيزه للتحميل في حال تم بناؤه
        if [ -d "build/ios/iphoneos/Runner.app" ]; then
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r user_app_ios.ipa Payload
        fi

    - name: Deploy Selected Outputs to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/ios/iphoneos/user_app_ios.ipa
          build/web/**
        token: ${{ secrets.GH_TOKEN }}
        tag_name: v4.0.${{ github.run_number }}
        name: تطبيق مخصص المنصات جاهز للتحميل #${{ github.run_number }}
        body: "تم بناء التطبيق وتجهيز المنصات واللغات المطلوبة بنجاح بواسطة محرك نجد AI البدوي والذكي لخدمة الجمهور."
        
