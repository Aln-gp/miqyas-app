name: Najd AI Project Auto-Builder

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Deploy Najd AI
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java Environment
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter Framework
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Initialize Project & Install Packages
      run: |
        flutter create . --overwrite --org com.Alnofaie
        
        # إضافة صلاحيات الإنترنت والأندرويد الأساسية
        sed -i '' 's|<manifest .*|&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>|' android/app/src/main/AndroidManifest.xml
        
        # ربط الفايربيس من الـ Secrets للأندرويد والآيفون إن وجدت
        mkdir -p android/app ios/Runner
        if [ ! -z "${{ secrets.FIREBASE_JSON_CONTENT }}" ]; then
          echo '${{ secrets.FIREBASE_JSON_CONTENT }}' > android/app/google-services.json
        fi
        if [ ! -z "${{ secrets.FIREBASE_IOS_PLIST }}" ]; then
          echo '${{ secrets.FIREBASE_IOS_PLIST }}' > ios/Runner/GoogleService-Info.plist
        fi
        
        sed -i '' 's|dependencies {|dependencies {\n        classpath "com.google.gms:google-services:4.3.15"|' android/build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

        # تثبيت المكاتب المطلوبة لتشغيل الواجهة والذكاء الاصطناعي
        flutter pub add http flutter_tts image_picker file_picker firebase_core firebase_auth
        flutter pub get
        
        sed -i '' 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true

    - name: Build and Deploy Core Platforms
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        GH_TOKEN_ENV: ${{ secrets.GH_TOKEN }}
        WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      run: |
        # بناء الويب والأندرويد والآيفون وتمرير التوكن والمفاتيح لداخل الكود ليستخدمها نجد AI في التحديث الذاتي
        flutter build web --release \
          --dart-define=GEMINI_API_KEY="$GEMINI_KEY" \
          --dart-define=GH_TOKEN="$GH_TOKEN_ENV" \
          --dart-define=FIREBASE_WEB_API_KEY="$WEB_API_KEY" \
          --dart-define=FIREBASE_WEB_APP_ID="$WEB_APP_ID"
          
        flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"
        flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"

    - name: Create Production Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/web/*
        token: ${{ secrets.GH_TOKEN }}
        tag_name: v1.2.${{ github.run_number }}
        name: نظام نجد للمزامنة والبرمجة التلقائية ${{ github.run_number }}
        body: "تم إصدار النسخة بنجاح ومزامنتها مع خوادم قيت هاب للبرمجة والتطوير الذاتي بناءً على نصوص المستخدم الحرة."
        
