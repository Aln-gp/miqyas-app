name: Najd AI Dynamic Platform Builder

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Dynamic Multi-Platform Compiler
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java Environment
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter Framework
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Initialize Project & Install Packages
      run: |
        # 1. إنشاء مشروع فلوتر نظيف وجديد بالكامل لتجنب أي ملفات تالفة سابقة
        flutter create . --overwrite --org com.Alnofaie
        
        # 2. حقن صلاحيات الأندرويد الأساسية في المانيفست بشكل آمن
        if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
          sed -i '' 's|<manifest .*|&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>|' android/app/src/main/AndroidManifest.xml
        fi
        
        # 3. تجهيز مجلدات الخدمات والفايربيس وإدخال الـ Secrets إذا تواجدت
        mkdir -p android/app ios/Runner
        if [ ! -z "${{ secrets.FIREBASE_JSON_CONTENT }}" ]; then
          echo '${{ secrets.FIREBASE_JSON_CONTENT }}' > android/app/google-services.json
        fi
        if [ ! -z "${{ secrets.FIREBASE_IOS_PLIST }}" ]; then
          echo '${{ secrets.FIREBASE_IOS_PLIST }}' > ios/Runner/GoogleService-Info.plist
        fi
        
        # 4. إعادة كتابة ملف الـ build.gradle.kts الرئيسي بالكامل (الجذر) بطريقة الكوتلن الصارمة والنظيفة
        cat << 'EOF' > android/build.gradle.kts
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath("com.android.tools.build:gradle:8.1.0")
                classpath("com.google.gms:google-services:4.4.1")
                classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22")
            }
        }
        tasks.register<Delete>("clean") {
            delete(rootProject.buildDir)
        }
        EOF

        # 5. إعادة كتابة ملف الـ build.gradle.kts الخاص بالتطبيق (android/app/) ليدمج الفايربيس والـ minSdkVersion المضمونة
        cat << 'EOF' > android/app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("com.google.gms.google-services")
            id("dev.flutter.flutter-gradle-plugin")
        }

        android {
            namespace = "com.Alnofaie"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.Alnofaie"
                minSdkVersion = 23
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("debug")
                    isMinifyEnabled = false
                    isShrinkResources = false
                fi
            }
        }
        EOF

        # 6. إضافة حزم فلوتر المطلوبة للمشروع والمنصة وتحديث المكاتب
        flutter pub add http flutter_tts image_picker file_picker firebase_core firebase_auth shared_preferences url_launcher
        flutter pub get

    - name: Execute Conditional Building
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        GH_TOKEN_ENV: ${{ secrets.GH_TOKEN }}
        WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      run: |
        # ملاحظة للمحرك البرمجي لـ نجد AI: قم بالتحكم بالأسطر أدناه تفعيلاً أو تعطيلاً بناءً على رغبة المستخدم النصية:
        
        # --- [منصة الويب] ---
        flutter build web --release --no-wasm-dry-run --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV" --dart-define=FIREBASE_WEB_API_KEY="$WEB_API_KEY" --dart-define=FIREBASE_WEB_APP_ID="$WEB_APP_ID"
          
        # --- [منصة الأندرويد] ---
        flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"
        
        # --- [منصة الآيفون] ---
        flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"

    - name: Bundle iOS App into IPA Archive
      run: |
        if [ -d "build/ios/iphoneos/Runner.app" ]; then
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r user_app_ios.ipa Payload
        fi

    - name: Deploy Selected Outputs to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/ios/iphoneos/user_app_ios.ipa
          build/web/**
        token: ${{ secrets.GH_TOKEN }}
        tag_name: v4.0.${{ github.run_number }}
        name: تطبيق مخصص المنصات جاهز للتحميل #${{ github.run_number }}
        body: "تم بناء التطبيق وتجهيز المنصات واللغات المطلوبة بنجاح بواسطة محرك نجد AI البدوي والذكّي لخدمة الجمهور."
        
