name: Najd AI Dynamic Platform Builder

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Dynamic Multi-Platform Compiler
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java Environment
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter Framework
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Firebase Tools & CLI
      run: |
        npm install -g firebase-tools
        dart pub global activate flutterfire_cli

    - name: Clean & Prepare Project Dependencies
      run: |
        # 1. تنظيف الكاش
        flutter clean
        
        # 2. تهيئة منصة الويب فقط إذا كان المجلد ناقصاً دون المساس بالأندرويد
        flutter create . --platforms web
        
        # 3. تحميل المكاتب
        flutter pub get

        # 4. ربط الفايربيس آلياً باستخدام علامات الاقتباس الآمنة للنصوص الطويلة
        if [ ! -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
          echo '${{ secrets.FIREBASE_TOKEN }}' > firebase_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase_key.json"
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutterfire configure \
            --yes \
            --project="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --platforms=android,ios,web
        fi

    - name: Execute Conditional Building
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        GH_TOKEN_ENV: ${{ secrets.GH_TOKEN }}
      run: |
        # --- [منصة الويب] ---
        flutter build web --release --no-wasm-dry-run --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"
          
        # --- [منصة الأندرويد] ---
        flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"
        
        # --- [منصة الآيفون] ---
        flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY="$GEMINI_KEY" --dart-define=GH_TOKEN="$GH_TOKEN_ENV"

    - name: Bundle iOS App into IPA Archive
      run: |
        if [ -d "build/ios/iphoneos/Runner.app" ]; then
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos && zip -r user_app_ios.ipa Payload
        fi

    - name: Deploy Selected Outputs to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/ios/iphoneos/user_app_ios.ipa
          build/web/**
        token: ${{ secrets.GH_TOKEN }}
        tag_name: v4.0.${{ github.run_number }}
        name: تطبيق مقياس جاهز للتحميل #${{ github.run_number }}
        body: "تم بناء وتجهيز منصات تطبيق مقياس بنجاح واكتمال مجلد الويب الأصلي."
        
